name: Version Validation
'on':
  workflow_call:
    inputs:
      version:
        description: Mod version to release
        type: string
        required: true
      disable_checks:
        description: Disable all version checks, including format validation
        type: boolean
        default: false
jobs:
  validate_version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout the triggering commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
    - name: Version Validation
      uses: Crystal-Nest/.github/.github/actions/gradle-workflow@main
      with:
        operation: validate-version
        version: ${{ inputs.version }}
        disable_checks: ${{ inputs.disable_checks }}
