name: Version Update
'on':
  workflow_call:
    inputs:
      version:
        description: Mod version to release
        type: string
        required: true
      dry_run:
        description: Dry run
        type: boolean
        default: false
jobs:
  update_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: Checkout the triggering commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
    - name: Version Update
      uses: Crystal-Nest/.github/.github/actions/gradle-workflow@main
      with:
        operation: update-version
        version: ${{ inputs.version }}
        dry_run: ${{ inputs.dry_run }}
