name: Single Release Workflow
'on':
  workflow_call:
    inputs:
      java-version:
        description: JDK version required by this Minecraft branch
        type: string
        required: true
      dry_run:
        description: Dry run
        type: boolean
        default: false
      loader_fabric:
        description: Fabric Loader
        type: boolean
        default: false
      loader_neoforge:
        description: NeoForge Loader
        type: boolean
        default: false
      loader_common:
        description: Common Loader
        type: boolean
        default: false
      platform_maven:
        description: Publish to Maven
        type: boolean
        default: false
      platform_github:
        description: Publish to GitHub
        type: boolean
        default: false
      platform_curseforge:
        description: Publish to CurseForge
        type: boolean
        default: false
      platform_modrinth:
        description: Publish to Modrinth
        type: boolean
        default: false
      modrinth-project-id:
        description: Modrinth README destination override
        type: string
        default: ''
      curseforge-project-id:
        description: Reserved CurseForge README destination override (no CurseForge upload)
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
jobs:
  single_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: Checkout the triggering commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Single Release Workflow
      uses: Crystal-Nest/.github/.github/actions/gradle-workflow@main
      with:
        operation: single-release
        java-version: ${{ inputs.java-version }}
        dry_run: ${{ inputs.dry_run }}
        loader_fabric: ${{ inputs.loader_fabric }}
        loader_neoforge: ${{ inputs.loader_neoforge }}
        loader_common: ${{ inputs.loader_common }}
        platform_maven: ${{ inputs.platform_maven }}
        platform_github: ${{ inputs.platform_github }}
        platform_curseforge: ${{ inputs.platform_curseforge }}
        platform_modrinth: ${{ inputs.platform_modrinth }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  sync-readme:
    needs: single_release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.platform_modrinth && (inputs.loader_fabric || inputs.loader_neoforge)
    permissions:
      contents: read
    uses: Crystal-Nest/.github/.github/workflows/sync_readme.yml@main
    with:
      modrinth-project-id: ${{ inputs.modrinth-project-id }}
      curseforge-project-id: ${{ inputs.curseforge-project-id }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
