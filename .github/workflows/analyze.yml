name: Analyze Workflow
'on':
  workflow_call:
    inputs:
      java-version:
        description: JDK version required by this Minecraft branch
        type: string
        required: true
    secrets:
      SONAR_TOKEN:
        required: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: analysis-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - name: Checkout the triggering commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Analyze Workflow
      uses: Crystal-Nest/.github/.github/actions/gradle-workflow@main
      with:
        operation: analyze
        java-version: ${{ inputs.java-version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
