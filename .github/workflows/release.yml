name: Release Workflow
'on':
  workflow_call:
    inputs:
      java-version:
        description: JDK version required by this Minecraft branch
        type: string
        required: true
      version:
        description: Mod version to release
        type: string
        required: true
      disable_checks:
        description: Disable all version checks, including format validation
        type: boolean
        default: false
      dry_run:
        description: Build and analyze without pushing a version commit or publishing releases
        type: boolean
        default: false
      modrinth-project-id:
        description: Modrinth README destination override
        type: string
        default: ''
      curseforge-project-id:
        description: Reserved CurseForge README destination override (no CurseForge upload)
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - name: Checkout the triggering commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - name: Release Workflow
      uses: Crystal-Nest/.github/.github/actions/gradle-workflow@main
      with:
        operation: release
        java-version: ${{ inputs.java-version }}
        version: ${{ inputs.version }}
        disable_checks: ${{ inputs.disable_checks }}
        dry_run: ${{ inputs.dry_run }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  sync-readme:
    needs: release
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: Crystal-Nest/.github/.github/workflows/sync_readme.yml@main
    with:
      modrinth-project-id: ${{ inputs.modrinth-project-id }}
      curseforge-project-id: ${{ inputs.curseforge-project-id }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
