name: Sync Modrinth README
'on':
  workflow_call:
    inputs:
      modrinth-project-id:
        description: Modrinth project ID or slug override
        type: string
        default: ''
      curseforge-project-id:
        description: Reserved CurseForge project ID override (no CurseForge upload)
        type: string
        default: ''
      dry_run:
        description: Preview the description without calling the Modrinth API
        type: boolean
        default: false
    secrets:
      MODRINTH_TOKEN:
        required: false
jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout the current default branch README
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - name: Sync README
      uses: Crystal-Nest/.github/.github/actions/sync-readme@main
      with:
        modrinth-project-id: ${{ inputs.modrinth-project-id }}
        curseforge-project-id: ${{ inputs.curseforge-project-id }}
        dry_run: ${{ inputs.dry_run }}
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
