import groovy.json.JsonSlurper
import java.security.MessageDigest
import org.gradle.api.tasks.bundling.AbstractArchiveTask

def manifestPath = System.getProperty('crystalNestReleaseArtifacts')
def manifest = new JsonSlurper().parse(new File(manifestPath))

gradle.rootProject { root ->
  // Included builds such as buildSrc maintain their own archives normally.
  if (root.projectDir.canonicalPath == new File(manifest.root).canonicalPath) {
    root.allprojects { project ->
      project.tasks.withType(AbstractArchiveTask).configureEach { archive ->
        archive.onlyIf('reuse the tested release archive') {
          def file = archive.archiveFile.get().asFile
          def expected = manifest.artifacts[file.canonicalPath]
          if (expected == null || !file.isFile()) {
            throw new GradleException("No tested release artifact for ${archive.path}: ${file}")
          }
          def digest = MessageDigest.getInstance('SHA-256')
          file.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int length
            while ((length = input.read(buffer)) != -1) {
              digest.update(buffer, 0, length)
            }
          }
          if (digest.digest().encodeHex().toString() != expected) {
            throw new GradleException("Tested release artifact changed: ${file}")
          }
          logger.lifecycle("Reusing tested artifact for ${archive.path}: ${file.name}")
          return false
        }
      }
    }
  }
}
